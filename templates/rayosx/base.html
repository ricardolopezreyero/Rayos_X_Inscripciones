<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Rayos X Inscripciones — SuperLeads{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://assets.cdn.filesafe.space/E6Gh1sE1RnPtadmL7wmG/media/69cffcaafa2dde9742fbf48b.png"/>
  <link rel="shortcut icon" href="https://assets.cdn.filesafe.space/E6Gh1sE1RnPtadmL7wmG/media/69cffcaafa2dde9742fbf48b.png"/>
  <link rel="apple-touch-icon" href="https://assets.cdn.filesafe.space/E6Gh1sE1RnPtadmL7wmG/media/69cffcaafa2dde9742fbf48b.png"/>

  <!-- Open Graph / Link preview -->
  <meta property="og:type"        content="website"/>
  <meta property="og:site_name"   content="SuperLeads"/>
  <meta property="og:title"       content="Rayos X Inscripciones — SuperLeads"/>
  <meta property="og:description" content="Diagnóstico exprés del sistema de inscripciones de tu institución. En 5 pasos detectamos exactamente dónde se pierden los prospectos y cuánto vale recuperarlos."/>
  <meta property="og:image"       content="https://assets.cdn.filesafe.space/E6Gh1sE1RnPtadmL7wmG/media/69ea69b5821e8babd841aa04.png"/>
  <meta property="og:image:width"  content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:url"         content="https://nonethnological-fatidically-piper.ngrok-free.dev/Rayos_X_inscripciones"/>

  <!-- Twitter / X Card -->
  <meta name="twitter:card"        content="summary_large_image"/>
  <meta name="twitter:title"       content="Rayos X Inscripciones — SuperLeads"/>
  <meta name="twitter:description" content="Diagnóstico exprés del sistema de inscripciones de tu institución. En 5 pasos detectamos exactamente dónde se pierden los prospectos y cuánto vale recuperarlos."/>
  <meta name="twitter:image"       content="https://assets.cdn.filesafe.space/E6Gh1sE1RnPtadmL7wmG/media/69ea69b5821e8babd841aa04.png"/>

  <!-- SEO -->
  <meta name="description" content="Diagnóstico exprés del sistema de inscripciones de tu institución. En 5 pasos detectamos exactamente dónde se pierden los prospectos y cuánto vale recuperarlos."/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#05103a', panel: '#0b1f69',
            'blue-strong': '#002582', 'blue-mid': '#0039c8',
            'blue-light': '#2a89fb', cyan: '#1db2fc',
            accent: '#56ef9f', 'text-main': '#edf4ff', 'text-muted': '#aac4ff',
          },
          fontFamily: { sans: ['Roboto', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    /* ── Variables ─────────────────────────────────────────── */
    :root {
      --bg:     #05103a;
      --panel:  #0b1f69;
      --panel2: #0d2275;
      --accent: #56ef9f;
      --cyan:   #1db2fc;
      --blue:   #2a89fb;
      --text:   #edf4ff;
      --muted:  #aac4ff;
      --border: rgba(42,137,251,0.28);
      --border-hover: rgba(42,137,251,0.55);
      --ease:   cubic-bezier(0.22,1,0.36,1);
      --radius: 14px;
    }

    /* ── Reset & Base ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 1400px 800px at 0% -5%,  rgba(42,137,251,0.22) 0%, transparent 55%),
        radial-gradient(ellipse  900px 600px at 100% 5%, rgba(29,178,252,0.18) 0%, transparent 55%),
        radial-gradient(ellipse  600px 400px at 50% 95%, rgba(86,239,159,0.06) 0%, transparent 60%),
        linear-gradient(165deg, #04113f 0%, #061a58 50%, #040f38 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ──────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(42,137,251,0.4); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(42,137,251,0.65); }

    /* ── Cards ──────────────────────────────────────────────── */
    .card {
      background: linear-gradient(145deg, rgba(13,34,117,0.85), rgba(11,31,105,0.7));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.04) inset;
      backdrop-filter: blur(8px);
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }
    .card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 6px 32px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.05) inset;
    }
    .card-inset {
      background: rgba(4,17,63,0.65);
      border: 1px solid rgba(42,137,251,0.18);
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }
    .card-accent-top {
      border-top: 2px solid var(--accent);
    }
    .card-cyan-top {
      border-top: 2px solid var(--cyan);
    }

    /* ── Buttons ────────────────────────────────────────────── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: var(--accent);
      color: #04102e;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.01em;
      border-radius: 10px;
      padding: 13px 28px;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), background 0.2s;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
      border-radius: inherit;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px rgba(86,239,159,0.5), 0 8px 28px rgba(86,239,159,0.35);
    }
    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 0 0 1px rgba(86,239,159,0.4), 0 2px 8px rgba(86,239,159,0.2);
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      border-radius: 9px;
      padding: 11px 22px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      text-decoration: none;
    }
    .btn-ghost:hover {
      border-color: var(--blue);
      color: var(--text);
      background: rgba(42,137,251,0.07);
    }

    /* ── Inputs ─────────────────────────────────────────────── */
    .input-field {
      width: 100%;
      background: rgba(4,15,54,0.75);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      padding: 11px 15px;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), background 0.2s;
      -webkit-appearance: none;
    }
    .input-field::placeholder {
      color: rgba(170,196,255,0.45);
      font-style: italic;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--cyan);
      background: rgba(4,17,63,0.9);
      box-shadow: 0 0 0 3px rgba(29,178,252,0.13);
    }
    .input-field:hover:not(:focus) {
      border-color: rgba(42,137,251,0.5);
    }
    textarea.input-field {
      resize: vertical;
      min-height: 82px;
      line-height: 1.55;
    }
    select.input-field option { background: #0b1f69; }

    /* Field label standard */
    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .field-label .req { color: var(--accent); margin-left: 3px; }

    /* ── Chips ──────────────────────────────────────────────── */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(11,31,105,0.55);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 7px 17px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      user-select: none;
      transition: all 0.18s var(--ease);
      position: relative;
    }
    .chip:hover {
      border-color: rgba(86,239,159,0.5);
      color: var(--text);
      background: rgba(86,239,159,0.07);
    }
    .chip.selected {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(86,239,159,0.12);
      box-shadow: 0 0 0 1px rgba(86,239,159,0.2);
    }
    .chip input[type=radio],
    .chip input[type=checkbox] { display: none; }

    /* ── Progress bar ───────────────────────────────────────── */
    .progress-bar-track {
      background: rgba(42,137,251,0.12);
      border-radius: 99px;
      height: 5px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #2a89fb 0%, #1db2fc 55%, #56ef9f 100%);
      transition: width 0.7s var(--ease);
      position: relative;
      overflow: hidden;
    }
    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0; left: -60%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: shimmer 2.2s infinite;
    }
    @keyframes shimmer {
      0%   { left: -60%; }
      100% { left: 130%; }
    }

    /* ── Section label ──────────────────────────────────────── */
    .section-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 6px;
    }

    /* ── Form group containers ──────────────────────────────── */
    .form-group {
      background: rgba(42,137,251,0.04);
      border: 1px solid rgba(42,137,251,0.16);
      border-radius: 11px;
      padding: 18px 20px;
    }

    /* ── Finding cards ──────────────────────────────────────── */
    .finding-card {
      background: linear-gradient(150deg, rgba(11,35,120,0.7) 0%, rgba(8,24,88,0.6) 100%);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 22px 24px;
      margin-bottom: 16px;
      transition: border-color 0.22s var(--ease), transform 0.22s var(--ease);
    }
    .finding-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }
    .severity-alta { border-top: 3px solid var(--accent); }
    .severity-media { border-top: 3px solid var(--cyan); }
    .severity-baja  { border-top: 3px solid var(--muted); }

    /* ── Badges ─────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 11px;
      border-radius: 20px;
      letter-spacing: 0.01em;
    }
    .badge-alta   { background: rgba(86,239,159,0.12);  color: #56ef9f; border: 1px solid rgba(86,239,159,0.25); }
    .badge-media  { background: rgba(29,178,252,0.12);  color: #1db2fc; border: 1px solid rgba(29,178,252,0.25); }
    .badge-prelim { background: rgba(170,196,255,0.08); color: #aac4ff; border: 1px solid rgba(170,196,255,0.2); }

    /* ── Nav bar ────────────────────────────────────────────── */
    .topbar {
      border-bottom: 1px solid rgba(42,137,251,0.12);
      padding: 13px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(5,16,58,0.6);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo-mark {
      height: 28px;
      width: auto;
      flex-shrink: 0;
      display: block;
    }

    /* ── Status pill ────────────────────────────────────────── */
    .status-pill {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 13px;
      border-radius: 20px;
    }
    .status-pill-cyan {
      background: rgba(29,178,252,0.1);
      border: 1px solid rgba(29,178,252,0.3);
      color: var(--cyan);
    }
    .status-pill-green {
      background: rgba(86,239,159,0.1);
      border: 1px solid rgba(86,239,159,0.3);
      color: var(--accent);
    }

    /* ── Divider ────────────────────────────────────────────── */
    .divider {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(42,137,251,0.25), transparent);
      margin: 0;
    }

    /* ── Evidence chips ─────────────────────────────────────── */
    .ev-chip {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      background: rgba(42,137,251,0.1);
      border: 1px solid rgba(42,137,251,0.22);
      border-radius: 20px;
      padding: 3px 12px;
      color: var(--muted);
    }

    /* ── Funnel bars ────────────────────────────────────────── */
    .funnel-bar-wrap {
      flex: 1;
      background: rgba(42,137,251,0.09);
      border-radius: 7px;
      height: 30px;
      overflow: hidden;
    }
    .funnel-bar-fill {
      height: 100%;
      border-radius: 7px;
      display: flex;
      align-items: center;
      padding-left: 12px;
      font-size: 12px;
      font-weight: 700;
      color: #04102e;
      transition: width 1.1s var(--ease);
    }

    /* ── Conversion pct colors ──────────────────────────────── */
    .conv-good   { color: var(--accent); }
    .conv-warn   { color: #ffd93d; }
    .conv-danger { color: #ff6b6b; }

    /* ── Page fade-in ───────────────────────────────────────── */
    .page-content {
      animation: fadeUp 0.45s var(--ease) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Insight box ────────────────────────────────────────── */
    .insight-box {
      background: rgba(29,178,252,0.07);
      border: 1px solid rgba(29,178,252,0.22);
      border-left: 3px solid var(--cyan);
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }
    .tip-box {
      background: rgba(86,239,159,0.05);
      border: 1px solid rgba(86,239,159,0.18);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 11px 16px;
      font-size: 13px;
      color: rgba(170,196,255,0.85);
      line-height: 1.55;
    }

    /* ── Step funnel item ───────────────────────────────────── */
    .funnel-item {
      background: rgba(11,31,105,0.45);
      border: 1px solid rgba(42,137,251,0.16);
      border-radius: 11px;
      padding: 16px 18px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    .funnel-item:focus-within {
      border-color: rgba(29,178,252,0.4);
      background: rgba(11,31,105,0.6);
    }

    /* ── Solution block ─────────────────────────────────────── */
    .solution-item {
      background: rgba(4,15,54,0.65);
      border: 1px solid rgba(42,137,251,0.18);
      border-radius: 9px;
      padding: 13px 17px;
      margin-bottom: 8px;
    }

    /* ── Score ring display ─────────────────────────────────── */
    .score-card {
      border-radius: 11px;
      padding: 16px 20px;
      min-width: 130px;
      text-align: center;
    }
    .score-card .score-val {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }
    .score-card .score-lbl {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* ── Responsive tweaks ──────────────────────────────────── */
    @media (max-width: 640px) {
      .topbar { padding: 10px 14px; gap: 8px; }
      .card { border-radius: 11px; }
      .btn-primary { font-size: 13px; padding: 12px 22px; }
      .finding-card { padding: 16px 18px; }
      .hide-mobile { display: none !important; }
      .topbar-brand-sub { display: none !important; }
      .status-pill { font-size: 9px !important; padding: 3px 9px !important; letter-spacing: 0.05em !important; }
    }
    @media (min-width: 641px) {
      .hide-desktop { display: none !important; }
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
